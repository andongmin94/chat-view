name: Apply capture qualification hardening

on:
  push:
    branches:
      - OBS
    paths:
      - scripts/apply-capture-qualification-hardening.py
      - .github/workflows/apply-capture-qualification-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/apply-capture-qualification-hardening.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt tests/obs-capture-qualification-plugin.cpp tests/obs-capture-qualification-test.cpp
          if git diff --cached --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git commit -m "test: stabilize OBS capture transition sampling"
          git push origin HEAD:OBS
