name: Apply Display Capture interlock

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-capture-risk-policy.yml
      - scripts/apply-capture-risk-policy.py

permissions:
  contents: write

jobs:
  apply:
    name: Apply capture-risk policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-capture-risk-policy.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit Display Capture interlock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "safety: hide private HUD during Display Capture output"
          git push origin HEAD:OBS
