name: Apply Control Center diagnostics

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-control-center-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Control Center diagnostics integration
        run: python scripts/apply-control-center-diagnostics.py

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md src tests
          git commit -m "feat: integrate diagnostics into the Control Center"
          git push origin HEAD:OBS
