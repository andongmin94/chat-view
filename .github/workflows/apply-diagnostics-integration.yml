name: Apply diagnostics integration

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-diagnostics-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply diagnostics integration
        run: python scripts/apply-diagnostics-integration.py

      - name: Commit diagnostics integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md .github/workflows/windows-build.yml
          git commit -m "feat: add privacy-safe diagnostics exporter"
          git push origin HEAD:OBS
