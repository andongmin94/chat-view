name: Apply bounded HUD resource soak

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-hud-resource-soak.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded HUD resource soak
        run: python scripts/apply-hud-resource-soak.py

      - name: Commit bounded HUD resource soak
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-build.yml scripts/run-hud-soak.ps1 src/preflight/hud-self-test.cpp
          git commit -m "test: add bounded HUD resource soak"
          git push origin HEAD:OBS
