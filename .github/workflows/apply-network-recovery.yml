name: Apply browser network recovery

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-network-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python scripts/rearm-page-watchdog.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hud/hud-window.cpp
          git commit -m "fix: rearm page watchdog after reconnect"
          git push origin HEAD:OBS
