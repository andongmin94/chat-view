name: Apply browser network recovery

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-network-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply network recovery changes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path('scripts/apply-network-recovery.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          python scripts/apply-network-recovery.py

      - name: Commit network recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            README.md \
            src/common/hud-health.hpp \
            src/config/main.cpp \
            src/hud/hud-window.cpp \
            src/hud/hud-window.hpp \
            src/hud/page-connection-recovery.hpp \
            src/hud/page-health-message.cpp \
            tests/hud-health-test.cpp \
            tests/page-connection-recovery-test.cpp \
            tests/page-health-message-test.cpp \
            tests/page-health-script-test.mjs
          if git diff --cached --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git commit -m "feat: recover browser and chat disconnects"
          git push origin HEAD:OBS
