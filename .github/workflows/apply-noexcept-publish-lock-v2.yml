name: Apply no-throw publish lock hardening v2

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-noexcept-publish-lock-v2.yml
      - scripts/apply-noexcept-publish-lock-v2.py

permissions:
  contents: write

jobs:
  apply:
    name: Apply corrected no-throw lock patch
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-noexcept-publish-lock-v2.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit lock hardening and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The patch produced no changes." >&2
            exit 1
          fi
          git commit -m "reliability: make OBS wake-handle locking non-throwing"
          git push origin HEAD:OBS
