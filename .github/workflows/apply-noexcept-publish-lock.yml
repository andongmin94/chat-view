name: Apply runtime boundary hardening

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-noexcept-publish-lock.yml
      - scripts/apply-noexcept-publish-lock.py

permissions:
  contents: write

jobs:
  apply:
    name: Apply runtime boundary patch
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-noexcept-publish-lock.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit runtime boundary hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: isolate the HUD control plane"
          git push origin HEAD:OBS
