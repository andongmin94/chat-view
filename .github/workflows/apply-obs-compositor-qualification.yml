name: Apply OBS compositor qualification

on:
  push:
    branches:
      - OBS
    paths:
      - scripts/apply-obs-compositor-qualification.py
      - .github/workflows/apply-obs-compositor-qualification.yml

permissions:
  contents: write

concurrency:
  group: apply-obs-compositor-qualification
  cancel-in-progress: true

jobs:
  apply:
    name: Apply compositor qualification
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic qualification patch
        run: python scripts/apply-obs-compositor-qualification.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'project(chat-view-obs VERSION 0.2.11 LANGUAGES CXX)' CMakeLists.txt
          grep -F 'chat-view-obs-capture-qualification' CMakeLists.txt
          grep -F 'pipeline=monitor_capture>scene>main_texture' tests/obs-capture-qualification-plugin.cpp
          grep -F 'hidden_window_excluded=1' tests/obs-capture-qualification-test.cpp
          grep -F '$qualificationTest $obsRoot' .github/workflows/windows-build.yml

      - name: Commit compositor qualification
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-obs-compositor-qualification.py
          rm -f .github/workflows/apply-obs-compositor-qualification.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Qualification patch made no changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: qualify private HUD in OBS compositor'
          git push origin HEAD:OBS
