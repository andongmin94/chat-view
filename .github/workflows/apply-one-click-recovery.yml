name: Apply one-click recovery actions

on:
  push:
    branches:
      - obs-preflight-work
    paths:
      - .github/workflows/apply-one-click-recovery.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disambiguate the required-controls patch anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-one-click-recovery.py")
          text = path.read_text(encoding="utf-8")
          old = """replace_once(
              \"src/config/main.cpp\",
              '''            recovery_value_,
                      feedback_,
                      save_button_,''',
              '''            recovery_value_,
                      feedback_,
                      recovery_button_,
                      save_button_,''',
          )"""
          new = """replace_once(
              \"src/config/main.cpp\",
              '''            recovery_value_,
                      feedback_,
                      save_button_,
                      edit_button_,
                      restart_button_,
                      diagnostics_button_};''',
              '''            recovery_value_,
                      feedback_,
                      recovery_button_,
                      save_button_,
                      edit_button_,
                      restart_button_,
                      diagnostics_button_};''',
          )"""
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one required-controls patch block, found {text.count(old)}")
          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
              newline="\n")
          PY

      - name: Apply one-click recovery layer
        run: python scripts/apply-one-click-recovery.py

      - name: Validate and commit recovery layer
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md src tests
          git diff --cached --check
          git commit -m "feat: add blocker-specific one-click recovery"
          git push origin HEAD:obs-preflight-work

      - name: Dispatch Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-build.yml --ref obs-preflight-work
