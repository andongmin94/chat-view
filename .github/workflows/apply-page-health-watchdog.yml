name: Apply page health watchdog

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-page-health-watchdog.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply page-health watchdog changes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip

          payload = ""
          source = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          namespace = {
              "__file__": "scripts/apply-page-health-watchdog.py",
              "__name__": "__main__",
          }
          exec(compile(source, namespace["__file__"], "exec"), namespace)
          PY

      - name: Commit page-health watchdog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            README.md \
            src/hud/page-health-message.cpp \
            src/hud/page-health-watchdog.hpp \
            src/hud/hud-window.hpp \
            src/hud/hud-window.cpp \
            tests/page-health-script-test.mjs \
            tests/page-health-watchdog-test.cpp
          if git diff --cached --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git commit -m "feat: recover stale page health heartbeats"
          git push origin HEAD:OBS
