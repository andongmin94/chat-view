name: Apply paused-startup readiness hardening

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-paused-startup-readiness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply paused-startup readiness hardening
        run: python scripts/fix-paused-startup-readiness.py

      - name: Commit paused-startup readiness hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hud/hud-window.cpp src/hud/hud-window.hpp
          git commit -m "fix: avoid HUD restart loops while Windows is paused"
          git push origin HEAD:OBS
