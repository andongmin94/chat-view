name: Apply bounded HUD restart hardening

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-restart-circuit.yml
      - scripts/apply-restart-circuit.py

permissions:
  contents: write

jobs:
  apply:
    name: Apply restart circuit patch
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-restart-circuit.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit restart hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            README.md \
            docs/architecture.md \
            data/locale/en-US.ini \
            data/locale/ko-KR.ini \
            src/plugin/plugin-main.cpp \
            src/plugin/restart-policy.hpp \
            src/plugin/runtime-controller.cpp \
            src/plugin/runtime-controller.hpp \
            tests/restart-policy-test.cpp
          git commit -m "reliability: bound HUD crash recovery"
          git push origin HEAD:OBS
