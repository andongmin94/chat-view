name: Apply runtime telemetry core

on:
  push:
    branches:
      - obs-runtime-telemetry-work
    paths:
      - .github/workflows/apply-runtime-telemetry-core.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime telemetry core
        run: python scripts/apply-runtime-telemetry-core.py

      - name: Commit runtime telemetry core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md src tests
          git commit -m "feat: persist HUD restart telemetry"
          git push origin HEAD:obs-runtime-telemetry-work
