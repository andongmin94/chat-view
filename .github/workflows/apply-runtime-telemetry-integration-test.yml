name: Apply runtime telemetry integration coverage

on:
  push:
    branches:
      - obs-runtime-telemetry-work
    paths:
      - .github/workflows/apply-runtime-telemetry-integration-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime telemetry integration coverage
        run: python scripts/apply-runtime-telemetry-integration-test.py

      - name: Commit runtime telemetry integration coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt tests/obs-runtime-smoke-test.cpp
          git commit -m "test: verify persisted HUD recovery telemetry"
          git push origin HEAD:obs-runtime-telemetry-work
