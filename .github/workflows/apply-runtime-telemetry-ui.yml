name: Apply runtime telemetry presentation

on:
  push:
    branches:
      - obs-runtime-telemetry-work
    paths:
      - .github/workflows/apply-runtime-telemetry-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime telemetry presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-runtime-telemetry-ui.py')
          text = path.read_text(encoding='utf-8')
          old = '    if count != 1:\n        raise SystemExit(f"{path_text}: expected one anchor, found {count}")'
          new = '    if count == 0:\n        raise SystemExit(f"{path_text}: expected an anchor, found {count}")'
          if text.count(old) != 1:
              raise SystemExit('replace helper anchor was not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python scripts/apply-runtime-telemetry-ui.py

      - name: Commit runtime telemetry presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/common/runtime-history-store.cpp src/config/main.cpp src/diagnostics/diagnostics-exporter.cpp tests/diagnostics-exporter-test.cpp
          git commit -m "feat: surface persistent HUD recovery history"
          git push origin HEAD:obs-runtime-telemetry-work
