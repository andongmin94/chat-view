name: Apply direct SOOP URL support

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-soop-support.yml
      - scripts/apply-soop-support.py

permissions:
  contents: write

jobs:
  apply:
    name: Apply SOOP URL patch
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-soop-support.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit SOOP support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            README.md \
            docs/architecture.md \
            src/common/chat-config.cpp \
            src/config/main.cpp \
            src/hud/webview-host.cpp \
            tests/chat-config-test.cpp
          git commit -m "feat: add direct SOOP chat URLs"
          git push origin HEAD:OBS
