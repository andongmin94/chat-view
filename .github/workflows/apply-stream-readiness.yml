name: Apply stream readiness gate

on:
  push:
    branches:
      - obs-preflight-work
    paths:
      - .github/workflows/apply-stream-readiness.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stream readiness gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-stream-readiness.py')
          text = path.read_text(encoding='utf-8')
          marker = '\ninsert_after(\n    "README.md",'
          if marker not in text:
              raise SystemExit('README patch marker was not found')
          path.write_text(
              text.split(marker, 1)[0] + '\n',
              encoding='utf-8',
              newline='\n')
          PY
          python scripts/apply-stream-readiness.py

      - name: Commit stream readiness gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src tests
          git commit -m "feat: add conservative stream readiness gate"
          git push origin HEAD:obs-preflight-work

      - name: Dispatch Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-build.yml --ref obs-preflight-work
