name: Apply stream readiness gate

on:
  push:
    branches:
      - obs-preflight-work
    paths:
      - .github/workflows/apply-stream-readiness.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stream readiness gate
        run: python scripts/apply-stream-readiness.py

      - name: Commit stream readiness gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md docs src tests
          git commit -m "feat: add conservative stream readiness gate"
          git push origin HEAD:obs-preflight-work

      - name: Dispatch Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-build.yml --ref obs-preflight-work
