              '''The platform page probe sends a compact health heartbeat every two seconds, even when the detected state has not changed. It also reports browser offline/online transitions and provider reconnecting or disconnected banners from bounded structural status regions rather than ordinary chat messages. The native HUD watchdog reloads a configured chat page after twelve seconds without a valid heartbeat. A separately bounded connection-recovery policy gives a reported disconnect ten seconds to recover, reloads the page once, and restarts the HUD if the disconnect survives another fifteen seconds. Browser-offline time and Display Capture suppression time do not count toward either recovery deadline.

`WDA_EXCLUDEFROMCAPTURE` is a best-effort Windows capture hint.
''',
              '''The platform page probe sends a compact health heartbeat every two seconds, even when the detected state has not changed. It also reports browser offline/online transitions and provider reconnecting or disconnected banners from bounded structural status regions rather than ordinary chat messages. The native HUD watchdog reloads a configured chat page after twelve seconds without a valid heartbeat. A separately bounded connection-recovery policy gives a reported disconnect ten seconds to recover, reloads the page once, and restarts the HUD if the disconnect survives another fifteen seconds. Browser-offline time and Display Capture suppression time do not count toward either recovery deadline.

Windows suspend and session-lock notifications immediately hide the HUD, leave edit mode, and pause page recovery. The HUD remains hidden until all pause reasons have cleared. After resume or unlock it waits briefly for DWM and networking to settle, reapplies and verifies capture exclusion, restores monitor-relative bounds, and reloads the configured chat page before showing. A WebView failure that occurs while Windows is paused is deferred and converted into one clean HUD-process restart only after resume, avoiding restart loops behind the lock screen.

`WDA_EXCLUDEFROMCAPTURE` is a best-effort Windows capture hint.
''')

          write_new(
              'src/hud/system-lifecycle.hpp',
              '''// SPDX-License-Identifier: GPL-2.0-or-later

#pragma once

#include <cstdint>

namespace chatview {

enum class SystemLifecycleAction : std::uint8_t {
    None = 0U,
    Pause = 1U,
    Resume = 2U,
};

class SystemLifecycle final {
public:
    [[nodiscard]] SystemLifecycleAction suspend() noexcept
    {
        return update(power_suspended_, true);
    }

    [[nodiscard]] SystemLifecycleAction resume() noexcept
    {
        return update(power_suspended_, false);
    }

    [[nodiscard]] SystemLifecycleAction lock_session() noexcept
    {
        return update(session_locked_, true);
    }

    [[nodiscard]] SystemLifecycleAction unlock_session() noexcept
    {
        return update(session_locked_, false);
    }

    void reset() noexcept
    {
        power_suspended_ = false;
        session_locked_ = false;
    }

    [[nodiscard]] bool paused() const noexcept
    {
        return power_suspended_ || session_locked_;
    }

    [[nodiscard]] bool power_suspended() const noexcept
    {
        return power_suspended_;
    }

    [[nodiscard]] bool session_locked() const noexcept
    {
        return session_locked_;
    }

private:
    [[nodiscard]] SystemLifecycleAction update(
        bool &flag,
        bool value) noexcept
    {
        const bool was_paused = paused();
        flag = value;
        const bool is_paused = paused();
        if (!was_paused && is_paused) {
            return SystemLifecycleAction::Pause;
        }
        if (was_paused && !is_paused) {
            return SystemLifecycleAction::Resume;
        }
        return SystemLifecycleAction::None;
    }

    bool power_suspended_ = false;
    bool session_locked_ = false;
};

} // namespace chatview
''')

          write_new(
              'tests/system-lifecycle-test.cpp',
              '''// SPDX-License-Identifier: GPL-2.0-or-later

#include "hud/system-lifecycle.hpp"

#include <iostream>

namespace {

int fail(const char *message)
{
    std::cerr << message << '\\n';
    return 1;
}

} // namespace

int main()
{
    using chatview::SystemLifecycle;
    using chatview::SystemLifecycleAction;

    SystemLifecycle lifecycle;
    if (lifecycle.paused() || lifecycle.power_suspended() ||
        lifecycle.session_locked()) {
        return fail("A new lifecycle state was unexpectedly paused");
    }

    if (lifecycle.resume() != SystemLifecycleAction::None ||
        lifecycle.unlock_session() != SystemLifecycleAction::None) {
        return fail("A duplicate active notification caused a transition");
    }

    if (lifecycle.suspend() != SystemLifecycleAction::Pause ||
        !lifecycle.paused() || !lifecycle.power_suspended() ||
        lifecycle.suspend() != SystemLifecycleAction::None) {
        return fail("Power suspend was not idempotent");
    }
    if (lifecycle.resume() != SystemLifecycleAction::Resume ||
        lifecycle.paused()) {
        return fail("Power resume did not return to the active state");
    }

    if (lifecycle.lock_session() != SystemLifecycleAction::Pause ||
        lifecycle.suspend() != SystemLifecycleAction::None ||
        lifecycle.unlock_session() != SystemLifecycleAction::None ||
        !lifecycle.paused() || !lifecycle.power_suspended() ||
        lifecycle.session_locked()) {
        return fail("Overlapping session and power pauses were not combined");
    }
    if (lifecycle.resume() != SystemLifecycleAction::Resume ||
        lifecycle.paused()) {
        return fail("The final pause reason did not trigger one resume");
    }

    if (lifecycle.lock_session() != SystemLifecycleAction::Pause ||
        lifecycle.unlock_session() != SystemLifecycleAction::Resume ||
        lifecycle.unlock_session() != SystemLifecycleAction::None) {
        return fail("Session lock transitions were not idempotent");
    }

    lifecycle.suspend();
    lifecycle.lock_session();
    lifecycle.reset();
    if (lifecycle.paused() || lifecycle.power_suspended() ||
        lifecycle.session_locked()) {
        return fail("Reset left a stale Windows pause reason");
    }

    return 0;
}
''')
