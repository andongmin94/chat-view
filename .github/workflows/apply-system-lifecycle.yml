name: Apply Windows lifecycle recovery

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-system-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lifecycle changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path_text}: expected one anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def write_new(path_text, content):
              path = Path(path_text)
              if path.exists():
                  raise SystemExit(f'{path_text}: file already exists')
              path.write_text(content, encoding='utf-8', newline='\n')

