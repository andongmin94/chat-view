name: Apply WebView callback generation hardening

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-webview-callback-generation.yml
      - scripts/apply-webview-callback-generation.py

permissions:
  contents: write

jobs:
  apply:
    name: Isolate asynchronous callback generations
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-webview-callback-generation.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit callback hardening and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The callback-generation patch produced no changes." >&2
            exit 1
          fi
          git commit -m "reliability: isolate WebView callback generations"
          git push origin HEAD:OBS
