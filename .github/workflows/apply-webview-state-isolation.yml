name: Apply WebView host-state isolation

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/apply-webview-state-isolation.yml
      - scripts/apply-webview-state-isolation.py

permissions:
  contents: write

jobs:
  apply:
    name: Isolate native host state from page globals
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-webview-state-isolation.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit WebView isolation and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The WebView isolation patch produced no changes." >&2
            exit 1
          fi
          git commit -m "security: isolate native HUD state from page globals"
          git push origin HEAD:OBS
