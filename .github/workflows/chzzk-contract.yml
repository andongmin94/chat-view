name: CHZZK contract

on:
  push:
    branches: [OBS]
    paths: ['platform/**', '.github/workflows/chzzk-contract.yml']
  pull_request:
    branches: [OBS]
    paths: ['platform/**', '.github/workflows/chzzk-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Inspect published parser versions and source repository
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          npm view parseuri versions repository dist --json
          npm view socket.io-client@2 version dependencies --json
      - name: Install pinned transport and test dependencies without lifecycle scripts
        id: dependencies
        run: npm install --ignore-scripts --no-audit
      - name: Audit dependency graph including test tools
        run: npm audit --audit-level=low
      - name: Verify HTTP, actual Socket.IO transport and own renderer with simulated provider
        run: npm test
      - name: Strict type check
        run: npm run typecheck
      - name: Report resolved dependency manifest
        if: always() && steps.dependencies.outcome == 'success' && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: cat package-lock.json
