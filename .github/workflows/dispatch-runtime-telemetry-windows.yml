name: Dispatch runtime telemetry Windows validation

on:
  push:
    branches:
      - obs-runtime-telemetry-work
    paths:
      - .github/workflows/dispatch-runtime-telemetry-windows.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the permanent Windows workflow on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-build.yml --repo andongmin94/chat-view --ref obs-runtime-telemetry-work
