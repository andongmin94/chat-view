name: Enable runtime telemetry Windows validation

on:
  push:
    branches:
      - obs-runtime-telemetry-work
    paths:
      - .github/workflows/enable-runtime-telemetry-windows.yml

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable temporary branch validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/windows-build.yml')
          text = path.read_text(encoding='utf-8')
          old = '  push:\n    branches:\n      - OBS\n'
          new = '  push:\n    branches:\n      - OBS\n      - obs-runtime-telemetry-work\n'
          if text.count(old) != 1:
              raise SystemExit('Windows workflow push branch anchor was not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit temporary validation trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-build.yml
          git commit -m "ci: validate runtime telemetry on Windows"
          git push origin HEAD:obs-runtime-telemetry-work
