name: Finalize one-click recovery

on:
  push:
    branches:
      - obs-preflight-work
    paths:
      - .github/workflows/finalize-one-click-recovery.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep Save and Apply as the only default button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/config/main.cpp")
          text = path.read_text(encoding="utf-8")
          old = 'L"Fix now", kRecoveryButtonId, BS_DEFPUSHBUTTON);'
          new = 'L"Fix now", kRecoveryButtonId, BS_PUSHBUTTON);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"expected one recovery-button style anchor, found {count}")
          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
              newline="\n")
          PY

      - name: Remove obsolete development scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch -- \
            '.github/workflows/apply-*.yml' \
            '.github/workflows/dispatch-runtime-telemetry-windows.yml' \
            '.github/workflows/enable-runtime-telemetry-windows.yml' \
            '.github/workflows/fix-stream-readiness-test.yml' \
            '.github/workflows/polish-stream-readiness.yml' \
            '.github/workflows/stabilize-hud-resource-soak.yml' \
            '.github/workflows/finalize-one-click-recovery.yml' \
            'scripts/apply-*.py' \
            'scripts/fix-stream-readiness-test.py' \
            'scripts/polish-stream-readiness.py' \
            'scripts/stabilize-hud-resource-soak.py' \
            'scripts/.runtime-telemetry-payload-*'

      - name: Validate and commit final source tree
        shell: bash
        run: |
          set -euo pipefail
          git add src/config/main.cpp
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize one-click recovery source tree"
          git push origin HEAD:obs-preflight-work

      - name: Dispatch clean Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-build.yml --ref obs-preflight-work
