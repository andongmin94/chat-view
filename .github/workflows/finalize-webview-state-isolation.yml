name: Finalize WebView host-state isolation

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/finalize-webview-state-isolation.yml
      - scripts/finalize-webview-state-isolation.py

permissions:
  contents: write

jobs:
  finalize:
    name: Converge isolated host-state channel
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Converge implementation
        run: python scripts/finalize-webview-state-isolation.py

      - name: Validate resulting diff
        run: git diff --check

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No WebView finalization changes were produced." >&2
            exit 1
          fi
          git commit -m "security: finalize isolated WebView host-state channel"
          git push origin HEAD:OBS
