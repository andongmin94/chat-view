name: Repair stream readiness integration test

on:
  push:
    branches:
      - obs-preflight-work
    paths:
      - .github/workflows/fix-stream-readiness-test.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair integration test
        run: python scripts/fix-stream-readiness-test.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/config-single-instance-test.cpp
          git commit -m "test: validate stream readiness transitions"
          git push origin HEAD:obs-preflight-work

      - name: Dispatch Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-build.yml --ref obs-preflight-work
