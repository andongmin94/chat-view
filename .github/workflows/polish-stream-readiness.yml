name: Polish stream readiness

on:
  push:
    branches:
      - obs-preflight-work
    paths:
      - .github/workflows/polish-stream-readiness.yml

permissions:
  contents: write
  actions: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply readiness polish
        run: python scripts/polish-stream-readiness.py

      - name: Commit readiness polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "perf: bound idle stream-readiness source scans"
          git push origin HEAD:obs-preflight-work

      - name: Dispatch Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-build.yml --ref obs-preflight-work
