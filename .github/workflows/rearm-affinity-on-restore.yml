name: Rearm capture affinity before HUD restoration

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/rearm-affinity-on-restore.yml
      - scripts/rearm-affinity-on-restore.py

permissions:
  contents: write

jobs:
  fix:
    name: Rearm capture affinity
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic fix
        run: python scripts/rearm-affinity-on-restore.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit affinity restoration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rearm capture affinity before HUD restoration"
          git push origin HEAD:OBS
