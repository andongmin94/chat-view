name: Refine Display Capture interlock

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/refine-capture-interlock.yml
      - scripts/refine-capture-interlock.py

permissions:
  contents: write

jobs:
  refine:
    name: Refine capture interlock
    runs-on: ubuntu-latest

    steps:
      - name: Check out OBS branch
        uses: actions/checkout@v4
        with:
          ref: OBS
          fetch-depth: 0

      - name: Apply deterministic refinement
        run: python scripts/refine-capture-interlock.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit capture refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "safety: close output-start capture gaps"
          git push origin HEAD:OBS
