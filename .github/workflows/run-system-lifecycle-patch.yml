name: Run Windows lifecycle patch

on:
  push:
    branches:
      - OBS
    paths:
      - .github/workflows/run-system-lifecycle-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and run staged Python patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-system-lifecycle.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1:
              raise SystemExit('staged Python start marker was not unique')
          body = source.split(start_marker, 1)[1]
          if body.count(end_marker) != 1:
              raise SystemExit('staged Python end marker was not unique')
          body = body.split(end_marker, 1)[0]

          recovered = []
          in_triple = False
          for line in body.splitlines():
              if in_triple:
                  restored = line
              elif not line:
                  restored = ''
              else:
                  if not line.startswith('          '):
                      raise SystemExit(f'outside-string line lost YAML indentation: {line!r}')
                  restored = line[10:]
              recovered.append(restored)
              if restored.count("'''") % 2 == 1:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('staged Python ended inside a triple-quoted string')

          script = '\n'.join(recovered) + '\n'
          compile(script, 'apply-system-lifecycle.py', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

      - name: Commit lifecycle changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md src tests
          git commit -m "feat: recover safely after Windows suspend and lock"
          git push origin HEAD:OBS
