name: Windows build

on:
  push:
    branches:
      - OBS
  pull_request:
    branches:
      - OBS
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OBS_VERSION: "32.2.2"
  OBS_COMMIT: ba2f32bdf791005443988a4955e963663e16b1ed
  OBS_PORTABLE_SHA256: 4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1
  WEBVIEW2_VERSION: "1.0.4129.50"

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Check out ChatView
        uses: actions/checkout@v4

      - name: Check out pinned OBS Studio sources
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          path: .ci/obs-studio
          fetch-depth: 1

      - name: Verify pinned OBS Studio commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $actualCommit = git -C .ci/obs-studio rev-parse HEAD
          if ($actualCommit -ne $env:OBS_COMMIT) {
            throw "OBS Studio tag $env:OBS_VERSION resolved to $actualCommit; expected $env:OBS_COMMIT"
          }

      - name: Restore OBS dependency downloads
        uses: actions/cache@v4
        with:
          path: .ci/obs-studio/.deps
          key: obs-deps-windows-x64-${{ env.OBS_COMMIT }}

      - name: Restore WebView2 SDK cache
        id: webview2-cache
        uses: actions/cache@v4
        with:
          path: .ci/webview2
          key: webview2-native-${{ env.WEBVIEW2_VERSION }}

      - name: Download WebView2 SDK
        if: steps.webview2-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/restore-webview2.ps1 `
            -Version $env:WEBVIEW2_VERSION `
            -Destination .ci/webview2

      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/ensure-webview2-runtime.ps1

      - name: Build OBS development libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $prefix = Join-Path $env:GITHUB_WORKSPACE '.ci/obs-prefix'

          cmake -S .ci/obs-studio -B .ci/obs-build `
            -G "Visual Studio 18 2026" `
            -A "x64,version=10.0.26100.0" `
            "-DOBS_VERSION_OVERRIDE:STRING=$env:OBS_VERSION" `
            -DENABLE_BROWSER:BOOL=OFF `
            -DENABLE_FRONTEND:BOOL=OFF `
            -DENABLE_PLUGINS:BOOL=OFF `
            -DENABLE_SCRIPTING:BOOL=OFF

          cmake --build .ci/obs-build `
            --target obs-frontend-api `
            --config RelWithDebInfo `
            --parallel

          cmake --install .ci/obs-build `
            --component Development `
            --config RelWithDebInfo `
            --prefix $prefix

      - name: Build, test, and install ChatView
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $prefix = (Resolve-Path '.ci/obs-prefix').Path
          $webview2 = (Resolve-Path '.ci/webview2').Path
          $obsDeps = @(Get-ChildItem '.ci/obs-studio/.deps' -Directory |
            Where-Object { $_.Name -match '^obs-deps-\d{4}-\d{2}-\d{2}-x64$' })
          if ($obsDeps.Count -ne 1) {
            throw "Expected one OBS x64 dependency prefix, found $($obsDeps.Count)"
          }

          $prefixPath = "$prefix;$($obsDeps[0].FullName)"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'

          cmake -S . -B build/windows-x64 `
            -G "Visual Studio 18 2026" `
            -A "x64,version=10.0.26100.0" `
            "-DCMAKE_PREFIX_PATH=$prefixPath" `
            "-DCMAKE_INSTALL_PREFIX=$dist" `
            "-DWEBVIEW2_SDK_DIR=$webview2" `
            "-DOBS_RUNTIME_DEPENDENCY_DIR=$($obsDeps[0].FullName)" `
            -DCHATVIEW_WARNINGS_AS_ERRORS:BOOL=ON

          cmake --build build/windows-x64 `
            --config RelWithDebInfo `
            --parallel

          ctest --test-dir build/windows-x64 `
            --build-config RelWithDebInfo `
            --output-on-failure

          ctest --test-dir build/windows-x64 `
            --build-config RelWithDebInfo `
            --repeat until-fail:5 `
            --output-on-failure

          cmake --install build/windows-x64 `
            --config RelWithDebInfo

      - name: Validate self-contained native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $visualStudio) {
            throw 'Visual Studio C++ tools were not found.'
          }

          $dumpbin = Get-ChildItem `
            (Join-Path $visualStudio 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') `
            -File |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found.'
          }

          $forbiddenDependencies = @(
            'MSVCP140.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          $binaries = @(
            'dist/obs-plugins/64bit/chat-view-obs.dll',
            'dist/obs-plugins/64bit/chat-view-hud.exe',
            'dist/obs-plugins/64bit/chat-view-config.exe',
            'dist/chat-view-self-test.exe',
            'dist/chat-view-plugin-preflight.exe'
          )

          foreach ($binary in $binaries) {
            $dependencies = (& $dumpbin.FullName /DEPENDENTS $binary | Out-String)
            foreach ($dependency in $forbiddenDependencies) {
              if ($dependencies -match [regex]::Escape($dependency)) {
                throw "$binary unexpectedly depends on $dependency"
              }
            }
          }

      - name: Validate package layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredFiles = @(
            'dist/obs-plugins/64bit/chat-view-obs.dll',
            'dist/obs-plugins/64bit/chat-view-hud.exe',
            'dist/obs-plugins/64bit/chat-view-config.exe',
            'dist/chat-view-self-test.exe',
            'dist/chat-view-plugin-preflight.exe',
            'dist/data/obs-plugins/chat-view-obs/locale/en-US.ini',
            'dist/data/obs-plugins/chat-view-obs/locale/ko-KR.ini',
            'dist/install.cmd',
            'dist/install.ps1',
            'dist/uninstall.cmd',
            'dist/uninstall.ps1',
            'dist/ensure-webview2-runtime.ps1',
            'dist/README.md',
            'dist/LICENSE'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Missing package file: $file"
            }
          }

      - name: Restore official OBS portable archive
        id: obs-portable-cache
        uses: actions/cache@v4
        with:
          path: .ci/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64.zip
          key: official-obs-portable-${{ env.OBS_VERSION }}-${{ env.OBS_PORTABLE_SHA256 }}

      - name: Download official OBS portable archive
        if: steps.obs-portable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path .ci -Force | Out-Null
          $archive = ".ci/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          $url = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:OBS_PORTABLE_SHA256) {
            throw "Official OBS archive hash mismatch: $actualHash"
          }

      - name: Test installation and runtime inside official OBS Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $archive = (Resolve-Path ".ci/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip").Path
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:OBS_PORTABLE_SHA256) {
            throw "Cached official OBS archive hash mismatch: $actualHash"
          }

          $runtime = Join-Path $env:GITHUB_WORKSPACE '.ci/obs-runtime-test'
          Remove-Item -LiteralPath $runtime -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force

          $obsExecutables = @(Get-ChildItem $runtime -Recurse -File -Filter obs64.exe |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]64bit[\\/]obs64\.exe$' })
          if ($obsExecutables.Count -ne 1) {
            throw "Expected one official OBS executable, found $($obsExecutables.Count)"
          }
          $obsRoot = $obsExecutables[0].Directory.Parent.Parent.FullName

          $env:LOCALAPPDATA = Join-Path $env:GITHUB_WORKSPACE '.ci/obs-runtime-localappdata'
          Remove-Item -LiteralPath $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null

          $installedFiles = @(
            (Join-Path $obsRoot 'obs-plugins/64bit/chat-view-obs.dll'),
            (Join-Path $obsRoot 'obs-plugins/64bit/chat-view-hud.exe'),
            (Join-Path $obsRoot 'obs-plugins/64bit/chat-view-config.exe'),
            (Join-Path $obsRoot 'data/obs-plugins/chat-view-obs/locale/en-US.ini'),
            (Join-Path $obsRoot 'data/obs-plugins/chat-view-obs/locale/ko-KR.ini')
          )
          $runtimeTest = (Resolve-Path 'build/windows-x64/RelWithDebInfo/chat-view-obs-runtime-test.exe').Path

          for ($cycle = 1; $cycle -le 3; $cycle++) {
            Write-Host "Official OBS lifecycle cycle $cycle/3"
            try {
              & ./dist/install.ps1 -ObsPath $obsRoot
              & ./dist/install.ps1 -ObsPath $obsRoot

              foreach ($file in $installedFiles) {
                if (-not (Test-Path $file -PathType Leaf)) {
                  throw "Installer cycle $cycle did not create: $file"
                }
              }

              & $runtimeTest $obsRoot
            }
            catch {
              Get-ChildItem $runtime -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '\.(txt|log)$' } |
                Select-String -Pattern 'ChatView|Failed to load|module' -SimpleMatch:$false -ErrorAction SilentlyContinue |
                Select-Object -Last 200 |
                ForEach-Object { Write-Host $_.Line }
              throw
            }
            finally {
              Get-Process -Name 'obs64' -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 500
              & ./dist/uninstall.ps1 -ObsPath $obsRoot
            }

            foreach ($file in $installedFiles) {
              if (Test-Path $file) {
                throw "Uninstaller cycle $cycle did not remove: $file"
              }
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: chat-view-obs-windows-x64
          path: dist
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
